<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaiView - Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Site name and main navigation -->
    <header>
        <a href="index.html" class="site-name"><span class="wai">Wai</span><span class="view">View</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="page">
        <div class="side left"></div>

        <!-- Main page content -->
        <main>
            <h1>Contact Us</h1>
            <p>Have a question or know a walk we should film? Send us a message.</p>

            <hr>

            <form action="thanks.html" method="get">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit" class="button">Send</button>
            </form>
        </main>

        <div class="side right"></div>
    </div>

    <!-- Footer with the colour theme picker -->
    <footer>

        <!-- colour theme picker (CSS only - see the colour themes section in style.css) -->
        <fieldset class="theme-picker">
            <legend>Colour theme:</legend>
            <input type="radio" name="theme" id="theme-default" checked>
            <label for="theme-default">Default</label>
            <input type="radio" name="theme" id="theme-dark">
            <label for="theme-dark">Dark</label>
            <input type="radio" name="theme" id="theme-contrast">
            <label for="theme-contrast">High contrast</label>
        </fieldset>

        <p>&copy; 2026 WaiView | Wintec COMP506 Group Project</p>
    </footer>

</body>
</html>
